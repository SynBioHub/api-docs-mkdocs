  /{uri}/edit/{field}:
    post:
      summary: Edit Field
      description: Edit a field of an object. Note that the actual controller endpoint name is /editField.
      parameters:
        - name: uri
          in: path
          required: true
          schema:
            type: string
          description: The URI of the object
        - name: field
          in: path
          required: true
          schema:
            type: string
            enum:
              - title
              - description
              - role
              - wasDerivedFrom
              - type
              - annotation
          description: The field to edit
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                previous:
                  type: string
                  description: The previous value of the field
                object:
                  type: string
                  description: The new value of the field
                pred:
                  type: string
                  description: A predicate for an annotation
              required:
                - previous
                - object
      responses:
        "200":
          description: Field edited successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an owner of this object
      tags:
        - Edit
  /{uri}/add/{field}:
    post:
      summary: Add Field
      description: Add a field to an object. Note that the actual controller endpoint name is /addField.
      parameters:
        - name: uri
          in: path
          required: true
          schema:
            type: string
          description: The URI of the object
        - name: field
          in: path
          required: true
          schema:
            type: string
            enum:
              - role
              - type
              - wasDerivedFrom
              - annotation
          description: The field to add
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                object:
                  type: string
                  description: The value of the field
                pred:
                  type: string
                  description: A predicate for an annotation
              required:
                - object
      responses:
        "200":
          description: Field added successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an owner of this object
      tags:
        - Edit
  /{uri}/remove:
    get:
      summary: Remove Object
      description: Remove the object specified by the URI, and the references to that object.
      parameters:
        - name: uri
          in: path
          required: true
          schema:
            type: string
          description: The URI of the object
      security:
        - userToken: []
      responses:
        "200":
          description: Object removed successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an owner of this object
        "404":
          description: Object not found
      tags:
        - Edit
  /{uri}/replace:
    get:
      summary: Replace Object
      description: Remove the object specified from URI, but leave references to the object.
      parameters:
        - name: uri
          in: path
          required: true
          schema:
            type: string
          description: The URI of the object
      security:
        - userToken: []
      responses:
        "200":
          description: Object removed successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an owner of this object
        "404":
          description: Object not found
      tags:
        - Edit
  /callPlugin:
    post:
      summary: Call Plugin
      description: Call a specified plugin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                endpoint:
                  type: string
                  enum: [status, evaluate, run]
                category:
                  type: string
                  enum: [rendering, submit, download]
                data:
                  type: object
                  description: Optional JSON data
                prefix:
                  type: string
              required:
                - name
                - endpoint
                - category
      responses:
        "200":
          description: Plugin response
      tags:
        - Plugins
