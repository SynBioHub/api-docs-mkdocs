openapi: 3.0.0
info:
  title: SynBioHub Main API
  version: 1.0.0
  description: "Main API endpoints for SynBioHub


    Supplementary guides for complex concepts:

    - [External Remotes](concepts/remotes.md)

    - [SynBioHub Plugins](concepts/plugins.md)"
servers:
  - url: https://synbiohub.org
    description: Main SynBioHub instance
  - url: http://localhost:7777
    description: Local development instance
paths:
  /login:
    post:
      summary: "Login"
      description: "Authenticates a user. Requires email (or username) and password. Returns a user token to be passed in the X-authorization header."
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
            example:
              email: "user@example.org"
              password: "password123"
      responses:
        "200":
          description: "Login successful, returns user token"
          content:
            text/plain:
              schema:
                type: string
              example: "fb767104-6294-4d8b-9800-994f1076b1f1"
        "401":
          description: "Unauthorized - invalid credentials"
      tags:
        - User Account
  /logout:
    post:
      summary: "Logout"
      description: "Logs out the user specified in the X-authorization header. Note that the actual controller endpoint is /do_logout."
      security:
        - userToken: []
      responses:
        "200":
          description: "Logout successful"
        "401":
          description: "Unauthorized - invalid or missing token"
      tags:
        - User Account
  /register:
    post:
      summary: "Register"
      description: "Register a new user on SynBioHub."
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                affiliation:
                  type: string
              required:
                - username
                - name
                - email
                - password
            example:
              username: "newuser"
              name: "New User"
              email: "user@example.org"
              password: "password123"
              affiliation: "Example University"
      responses:
        "200":
          description: "Registration successful"
        "400":
          description: "Bad request - invalid input or user already exists"
      tags:
        - User Account
  /resetPassword:
    post:
      summary: "Request Reset Password Token"
      description: "Request a reset password token. (Note: Currently no implementation code)."
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: "The username or email of the user"
              required:
                - user
            example:
              user: "user@example.org"
      responses:
        "200":
          description: "Reset token requested (if user exists)"
      tags:
        - User Account
  /setNewPassword:
    post:
      summary: "Set New Password"
      description: "Resets the user's password with the provided token and two copies of the new password. (Note: Currently no implementation code)."
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                passwordConfirm:
                  type: string
              required:
                - token
                - password
                - passwordConfirm
            example:
              token: "reset-token-123"
              password: "new-password"
              passwordConfirm: "new-password"
      responses:
        "200":
          description: "Password reset successful"
        "400":
          description: "Bad request - invalid token or passwords do not match"
      tags:
        - User Account
  /profile:
    get:
      summary: "View Profile"
      description: "View the user's profile. Requires X-authorization header."
      security:
        - userToken: []
      responses:
        "200":
          description: "User profile information"
          content:
            application/json:
              schema:
                type: object
              example:
                username: "user123"
                name: "John Doe"
                email: "john@example.org"
                affiliation: "Example University"
        "401":
          description: "Unauthorized - invalid or missing token"
      tags:
        - User Account
    post:
      summary: "Update Profile"
      description: "Update the user's profile. Requires X-authorization header. Currently only updates name, email, and affiliation."
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                affiliation:
                  type: string
            example:
              name: "John Smith"
              email: "jsmith@example.org"
              affiliation: "New University"
      responses:
        "200":
          description: "Profile updated successfully"
        "401":
          description: "Unauthorized - invalid or expired session"
      tags:
        - User Account
  /admin/remotes:
    get:
      summary: View Remotes
      description: View current remote repositories
      security:
        - userToken: []
      responses:
        "200":
          description: List of current remote repositories
          content:
            text/plain:
              schema:
                type: string
                description: Current remote repositories information
              example: "benchling (Benchling): https://benchling.com/api

                ice (ICE): https://ice.example.org"
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an administrator
      tags:
        - Remotes Management
  /admin/saveRemote:
    post:
      summary: Save Remote (Benchling or ICE)
      description: Save a new Benchling or ICE remote repository
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - benchling
                    - ice
                  description: Type of the remote (Benchling or ICE)
                id:
                  type: string
                  description: Id of the remote
                url:
                  type: string
                  format: uri
                  description: URL for the remote
                benchlingApiToken:
                  type: string
                  description: API token for the Benchling remote (required if type is benchling)
                iceApiTokenClient:
                  type: string
                  description: ICE API token client (required if type is ice)
                iceApiToken:
                  type: string
                  description: ICE API token (required if type is ice)
                iceApiTokenOwner:
                  type: string
                  description: ICE API token owner (required if type is ice)
                iceCollection:
                  type: string
                  description: ICE collection
                rejectUnauthorized:
                  type: string
                  enum:
                    - "true"
                    - "false"
                  description: Whether to check SSL certificate
                  default: "true"
                folderPrefix:
                  type: string
                  description: Prefix to use for folders on the remote
                sequenceSuffix:
                  type: string
                  description: Suffix to use for sequences found on the remote
                defaultFolderId:
                  type: string
                  description: Default folder on the remote to access
                groupId:
                  type: string
                  description: Group id on ICE
                pi:
                  type: string
                  description: Principal Investigator name (ICE)
                piEmail:
                  type: string
                  format: email
                  description: Principal Investigator email (ICE)
                isPublic:
                  type: string
                  enum:
                    - "true"
                    - "false"
                  description: Should the remote be visible publicly?
                  default: "true"
                partNumberPrefix:
                  type: string
                  description: Prefix to use for parts (ICE)
                rootCollectionDisplayId:
                  type: string
                  description: Display id for the root collection on the remote
                rootCollectionName:
                  type: string
                  description: Name for the root collection on the remote
                rootCollectionDescription:
                  type: string
                  description: Description for the root collection on the remote
              required:
                - type
                - id
            example:
              type: benchling
              id: my-benchling-remote
              url: https://benchling.com/api
              benchlingApiToken: sk_live_abc123
              isPublic: "true"
              rootCollectionDisplayId: benchling_collection
              rootCollectionName: Benchling Collection
              rootCollectionDescription: Remotely accessed Benchling parts
      responses:
        "200":
          description: Remote saved successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an administrator
      tags:
        - Remotes Management
  /admin/deleteRemote:
    post:
      summary: Delete Remote
      description: Delete a remote repository
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Id of the remote configuration to remove
              required:
                - id
            example:
              id: my-benchling
      responses:
        "200":
          description: Remote deleted successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an administrator
      tags:
        - Remotes Management
  /{uri}/addOwner:
    post:
      summary: Add Owner
      description: Add an owner to an object
      parameters:
        - name: uri
          in: path
          required: true
          schema:
            type: string
          description: The URI of the object
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: The user ID of the owner being added
              required:
                - user
      responses:
        "200":
          description: Owner added successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user does not have permission
      tags:
        - Permission
  /{uri}/removeOwner/{username}:
    post:
      summary: Remove Owner
      description: Remove an owner from an object
      parameters:
        - name: uri
          in: path
          required: true
          schema:
            type: string
          description: The URI of the object
        - name: username
          in: path
          required: true
          schema:
            type: string
          description: The username of the owner being removed
      security:
        - userToken: []
      responses:
        "200":
          description: Owner removed successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user does not have permission
      tags:
        - Permission
  /submit:
    post:
      summary: Submit SBOL Document
      description:
        Create a new collection or add to an existing collection using
        the elements within a file
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description:
                    A user-defined string identifier for the submission,
                    alphanumeric and underscores only
                version:
                  type: string
                  description: The version string to associate with the submission
                name:
                  type: string
                  description: The name string to assign to the submission
                description:
                  type: string
                  description: The description string to assign to the submission
                citations:
                  type: string
                  description:
                    A list of comma separated pubmed IDs of citations to
                    store with the submission
                overwrite_merge:
                  type: string
                  description:
                    0 prevent if submission exists, 1 overwrite if submission
                    exists, 2 to merge and prevent if submission exists, 3 to merge
                    and overwrite matching URIs
                  enum:
                    - "0"
                    - "1"
                    - "2"
                    - "3"
                file:
                  type: string
                  format: binary
                  description:
                    Contents of an SBOL2, SBOL1, GenBank, FASTA, GFF3,
                    ZIP, or COMBINE Archive file
                rootCollections:
                  type: string
                  description: The URI of the collection to be submitted into
              required:
                - file
      responses:
        "200":
          description: Submission successful
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Unauthorized - invalid or missing token
        "415":
          description: Unsupported media type - file format not recognized
        "500":
          description: Server error processing submission
      tags:
        - Submission
  /{prefix}/{designid}/{version}/makePublic:
    post:
      summary: Make Collection Public
      description: Makes the collection specified by the URI public
      parameters:
        - name: prefix
          in: path
          required: true
          schema:
            type: string
          description: The collection prefix
        - name: designid
          in: path
          required: true
          schema:
            type: string
          description: The design ID
        - name: version
          in: path
          required: true
          schema:
            type: string
          description: The version number
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: The id for the new collection
                version:
                  type: string
                  description: The version for the new collection
                name:
                  type: string
                  description:
                    The name for the new collection (optional, default
                    is existing name)
                description:
                  type: string
                  description:
                    The description for the new collection (optional, default
                    is existing description)
                citations:
                  type: string
                  description:
                    The comma-separated list of PubMed ids (optional, default
                    is existing citations)
                tabState:
                  type: string
                  enum:
                    - new
                    - existing
                  description:
                    Use "new" for moving to a new public collection, and
                    "existing" if moving into an existing public collection
                collections:
                  type: string
                  format: uri
                  description:
                    If moving into an existing collection, the URI of the
                    collection
              required:
                - id
                - tabState
      responses:
        "200":
          description: Collection made public successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an owner of this collection
        "404":
          description: Collection not found
      tags:
        - Submission
  /{prefix}/{designid}/{version}/removeCollection:
    get:
      summary: Remove Collection
      description: Removes the collection specified by the URI
      parameters:
        - name: prefix
          in: path
          required: true
          schema:
            type: string
          description: The collection prefix
        - name: designid
          in: path
          required: true
          schema:
            type: string
          description: The design ID
        - name: version
          in: path
          required: true
          schema:
            type: string
          description: The version number
      security:
        - userToken: []
      responses:
        "200":
          description: Collection removed successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an owner of this collection
        "404":
          description: Collection not found
      tags:
        - Submission
  /{prefix}/{designid}/{version}/remove:
    get:
      summary: Remove Object
      description:
        Remove the object specified by the URI, and references to that
        object
      parameters:
        - name: prefix
          in: path
          required: true
          schema:
            type: string
          description: The collection prefix
        - name: designid
          in: path
          required: true
          schema:
            type: string
          description: The design ID
        - name: version
          in: path
          required: true
          schema:
            type: string
          description: The version number
      security:
        - userToken: []
      responses:
        "200":
          description: Object removed successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an owner of this object
        "404":
          description: Object not found
      tags:
        - Submission
  /{prefix}/{designid}/{version}/replace:
    get:
      summary: Replace Object
      description:
        Remove the object specified by the URI, but leave references to
        the object
      parameters:
        - name: prefix
          in: path
          required: true
          schema:
            type: string
          description: The collection prefix
        - name: designid
          in: path
          required: true
          schema:
            type: string
          description: The design ID
        - name: version
          in: path
          required: true
          schema:
            type: string
          description: The version number
      security:
        - userToken: []
      responses:
        "200":
          description: Object replaced successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an owner of this object
        "404":
          description: Object not found
      tags:
        - Submission
  /{prefix}/{designid}/{version}/icon:
    post:
      summary: Update Collection Icon
      description: Updates the collection's icon
      parameters:
        - name: prefix
          in: path
          required: true
          schema:
            type: string
          description: The collection prefix
        - name: designid
          in: path
          required: true
          schema:
            type: string
          description: The design ID
        - name: version
          in: path
          required: true
          schema:
            type: string
          description: The version number
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                collectionIcon:
                  type: string
                  format: binary
                  description: The desired collection icon
              required:
                - collectionIcon
      responses:
        "200":
          description: Collection icon updated successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an owner of this collection
        "404":
          description: Collection not found
        "415":
          description: Unsupported media type - file format not recognized
      tags:
        - Submission
  /{prefix}/{designid}/{version}/addToCollection:
    post:
      summary: Add to Collection
      description:
        Add member specified by the URI to a collection specified by the
        collections parameter
      parameters:
        - name: prefix
          in: path
          required: true
          schema:
            type: string
          description: The collection prefix
        - name: designid
          in: path
          required: true
          schema:
            type: string
          description: The design ID
        - name: version
          in: path
          required: true
          schema:
            type: string
          description: The version number
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                collections:
                  type: string
                  format: uri
                  description: The URI of collection to add a member to
              required:
                - collections
      responses:
        "200":
          description: Member added to collection successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an owner of this object
        "404":
          description: Object not found
      tags:
        - Submission
  /{prefix}/{designid}/{version}/removeMembership:
    post:
      summary: Remove Membership
      description:
        Remove a member specified by the member parameter of a collection
        specified by the URI
      parameters:
        - name: prefix
          in: path
          required: true
          schema:
            type: string
          description: The collection prefix
        - name: designid
          in: path
          required: true
          schema:
            type: string
          description: The design ID
        - name: version
          in: path
          required: true
          schema:
            type: string
          description: The version number
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                member:
                  type: string
                  format: uri
                  description: The URI of the object to remove as a member
              required:
                - member
      responses:
        "200":
          description: Membership removed successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an owner of this object
        "404":
          description: Object not found
      tags:
        - Submission
  /admin/deleteRegistry:
    post:
      summary: Delete Registry
      description: Delete a registry from the Web of Registries
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                uri:
                  type: string
                  format: uri
                  description: URI prefix of the registry to delete
              required:
                - uri
      responses:
        "200":
          description: Registry deleted successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an administrator
        "404":
          description: Registry not found
      tags:
        - Registry Management
  /admin/setAdministratorEmail:
    post:
      summary: Set Administrator Email
      description: Update Web Of Registries administrator email
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                administratorEmail:
                  type: string
                  format: email
                  description: Administrator email address
              required:
                - administratorEmail
      responses:
        "200":
          description: Administrator email updated successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an administrator
      tags:
        - Registry Management
  /admin/retrieveFromWebOfRegistries:
    post:
      summary: Retrieve From Web Of Registries
      description: Update registries from Web-of-Registries
      security:
        - userToken: []
      responses:
        "200":
          description: Registries updated successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an administrator
      tags:
        - Registry Management
  /admin/federate:
    post:
      summary: Federate
      description: Send request to join Web-of-Registries for a SynBioHub instance
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                administratorEmail:
                  type: string
                  format: email
                  description: Administrator email address
                webOfRegistries:
                  type: string
                  format: uri
                  description: URL for the Web-of-Registries
              required:
                - administratorEmail
                - webOfRegistries
      responses:
        "200":
          description: Federation request sent successfully
        "401":
          description: Unauthorized - invalid or missing token
        "403":
          description: Forbidden - user is not an administrator
      tags:
        - Registry Management
  /search/{query}:
    get:
      summary: Search metadata
      description: Returns metadata for objects matching the search query
      parameters:
        - name: query
          in: path
          required: true
          schema:
            type: string
          description:
            "Search query composed of key=value pairs and optional search
            string. For sequence search, use keys: globalsequence, sequence, file_search,
            maxaccepts, maxrejects, id, iddef."
          example: objectType=ComponentDefinition&role=http://identifiers.org/so/SO:0000316&searchterm
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
          description: Pagination offset
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
          description: Maximum number of results to return
      security:
        - userToken: []
        - {}
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    uri:
                      type: string
                      format: uri
                    name:
                      type: string
                    description:
                      type: string
                    displayId:
                      type: string
                    version:
                      type: string
              example:
                - uri: https://synbiohub.org/public/igem/BBa_B0034/1
                  name: BBa_B0034
                  description: RBS (Elowitz 1999) - medium efficiency
                  displayId: BBa_B0034
                  version: "1"
      tags:
        - Search
  /searchCount/{query}:
    get:
      summary: Count search results
      description: Returns the number of items matching the search query
      parameters:
        - name: query
          in: path
          required: true
          schema:
            type: string
          description:
            Search query composed of key=value pairs and optional search
            string
          example: objectType=ComponentDefinition&role=http://identifiers.org/so/SO:0000316&searchterm
      security:
        - userToken: []
        - {}
      responses:
        "200":
          description: Count of matching items
          content:
            text/plain:
              schema:
                type: integer
      tags:
        - Search
  /rootCollections:
    get:
      summary: Get root collections
      description: Returns a list of all root collections
      security:
        - userToken: []
        - {}
      responses:
        "200":
          description: List of root collections
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    uri:
                      type: string
                      format: uri
                    name:
                      type: string
                    description:
                      type: string
                    displayId:
                      type: string
                    version:
                      type: string
      tags:
        - Search
  /manage:
    get:
      summary: View user submissions
      description: Returns metadata on all submissions for the authenticated user
      security:
        - userToken: []
      responses:
        "200":
          description: User submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    displayId:
                      type: string
                    version:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
                    type:
                      type: string
                    uri:
